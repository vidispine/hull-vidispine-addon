# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

parameters:
- name: RunTests
  type: boolean
  default: false
- name: DockerRegistryServiceConnection
  displayName: 'The name of the service connection representing the Docker registry to push to.'
  type: string
  default: "vidinet Docker Registry"
- name: DockerRegistry
  displayName: 'The Docker registry to push to. Must match the registry in the Service Connection.'
  type: string
  default: "cr.vidinet.net"
- name: DevNoChart
  displayName: "Create images with tag :dev, don't create helm chart"
  type: boolean
  default: false
- name: addDockerProvenanceMode
  displayName: "Enable Docker image provenance in given mode"
  type: string
  default: "false"
  values:
    - "false"
    - "mode=min"
    - "mode=max"
- name: addDockerSBOM
  displayName: "Enable Docker image SBOM generation"
  type: boolean
  default: false

trigger: none
pr: none

pool:
    vmImage: 'ubuntu-24.04'

jobs:
- job: RunTests
  steps:

  - template: azure-pipelines-test.yml  # Template reference
    parameters:
      RunTests: ${{ parameters.RunTests }}
      HelmVersions:
      - version: "3.19.0"
      - version: "3.21.3"
      - version: "4.0.0"
      - version: "4.2.3"

- job: CreateRelease
  dependsOn: RunTests
  steps:
  - task: Bash@3
    displayName: 'Display Agent Docker Info'
    inputs:
      targetType: 'inline'
      script: |
        # 1. Full runtime state: storage driver, snapshotters, runtimes,
        #    cgroup driver, registry mirrors, live-restore, versions, etc.
        docker info

        # 2. Client + server version/build/API details
        docker version

        # 3. The daemon config file (flags NOT shown here are compiled/CLI defaults) - root required
        cat /etc/docker/daemon.json 2>/dev/null || echo "no daemon.json (all defaults)"

        # 4. How the daemon is actually launched (systemd unit + drop-ins / ExecStart flags)
        systemctl cat docker.service

        # 5. Effective runtime environment of the daemon (proxies, etc.)
        systemctl show docker.service -p Environment

        # 6. containerd side (if you care about its config) - root required
        cat /etc/containerd/config.toml 2>/dev/null || echo "containerd using defaults"
  - script: |
        export HULL_VSADDON_VERSION=`sed -n 's/^version:\s//p' ./hull-vidispine-addon/Chart.yaml | sed 's/\"//g'`
        if [ "${DEV_NO_CHART,,}" = "true" ]; then
          echo "-> DevNoChart is true; using 'dev' version tag instead of '${HULL_VSADDON_VERSION}' from Chart.yaml"
          export HULL_VSADDON_VERSION="dev"
        else
          echo "-> hull-vidispine-addon version is ${HULL_VSADDON_VERSION}"
          sed -i -e "s/<HULL-VIDISPINE-ADDON-VERSION>/$HULL_VSADDON_VERSION/g" ./hull-vidispine-addon/hull-vidispine-addon.yaml
        fi
        echo "##vso[task.setvariable variable=HULL_VSADDON_VERSION;]${HULL_VSADDON_VERSION}"
        echo "-Y set hull-integration version to ${HULL_VSADDON_VERSION}"
    displayName: 'Set hull/Hull-integration version'
    env:
      DEV_NO_CHART: ${{ parameters.DevNoChart }}
  - script: |
        PROVENANCE_SBOM_ARGS=""
        if [ "${ADD_PROVENANCE_MODE,,}" != "false" ]; then
          PROVENANCE_SBOM_ARGS=" --provenance=${ADD_PROVENANCE_MODE}"
        fi
        if [ "${ADD_SBOM,,}" = "true" ]; then
          if [ "${PROVENANCE_SBOM_ARGS}" == "" ]; then
            # would default to --provenance=mode=min when any attestations are enabled. Disable explicitly.
            PROVENANCE_SBOM_ARGS=" --provenance=false"
          fi
          PROVENANCE_SBOM_ARGS="${PROVENANCE_SBOM_ARGS} --sbom=true"
        fi
        echo "Docker provenance/SBOM args: ${PROVENANCE_SBOM_ARGS}"
        echo "##vso[task.setvariable variable=HULL_INTEGRATION_PROVENANCE_SBOM_ARGS;]${PROVENANCE_SBOM_ARGS}"
    displayName: 'Set Docker provenance/SBOM args as configured'
    env:
      ADD_PROVENANCE_MODE: ${{ parameters.addDockerProvenanceMode }}
      ADD_SBOM: ${{ parameters.addDockerSBOM }}
      
  - task: Docker@2
    displayName: 'Docker Login'
    inputs:
      command: login
      containerRegistry: '${{ parameters.DockerRegistryServiceConnection }}'
  - script: |
        HULL_INTEGRATION_DOCKER_DRIVER="docker-container"
        echo "Creating docker builder for provenance and SBOM, driver: $HULL_INTEGRATION_DOCKER_DRIVER ..."
        docker buildx create --use --driver $HULL_INTEGRATION_DOCKER_DRIVER --name hull-integration-builder-attest
    displayName: 'Create Docker builder for provenance and SBOM'
    condition: "and(succeeded(), ne(variables['HULL_INTEGRATION_PROVENANCE_SBOM_ARGS'], ''))"

  - task: Bash@3
    displayName: 'Build and push image (noroot by default).'
    inputs:
      targetType: 'inline'
      script: |
        docker buildx build \
          ${HULL_INTEGRATION_PROVENANCE_SBOM_ARGS} \
          --tag ${HULL_INTEGRATION_IMAGE_REGISTRY}/hull/hull-integration:${HULL_VSADDON_VERSION} \
          --file ./images/hull-integration/Dockerfile \
          --push \
          ./images/hull-integration
    env:
      HULL_INTEGRATION_IMAGE_REGISTRY: ${{ parameters.DockerRegistry }}
      HULL_VSADDON_VERSION: $(HULL_VSADDON_VERSION)
      HULL_INTEGRATION_PROVENANCE_SBOM_ARGS: $(HULL_INTEGRATION_PROVENANCE_SBOM_ARGS)

  - script: |
        CHART_RELEASER_VERSION=1.5.0
        set -euo pipefail
        echo package chart
        cp -r . $(Agent.TempDirectory)
        cd $(Agent.TempDirectory)        
        wget https://github.com/helm/chart-releaser/releases/download/v${CHART_RELEASER_VERSION}/chart-releaser_${CHART_RELEASER_VERSION}_linux_amd64.tar.gz
        tar -xvzf chart-releaser_${CHART_RELEASER_VERSION}_linux_amd64.tar.gz -C ./
        ls
        sudo chmod +x ./cr
        sudo ./cr package ./hull-vidispine-addon 
        sudo ./cr upload --git-repo hull-vidispine-addon --owner vidispine --token $(GITHUBTOKEN) || true
        mkdir .cr-index
        wget https://vidispine.github.io/hull-vidispine-addon/index.yaml -O .cr-index/index.yaml
        sudo ./cr index --git-repo hull-vidispine-addon --owner vidispine --token $(GITHUBTOKEN) --charts-repo https://vidispine.github.io/hull-vidispine-addon --push
    condition: and(succeeded(), not(${{ parameters.DevNoChart }}))
