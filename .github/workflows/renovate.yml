name: Renovate

on:
  schedule:
    - cron: "37 2 * * 1-5" # Every Monday to Friday at 02:37 UTC
  workflow_dispatch: # Manual runs from the Actions tab
    inputs:
      dry_run:
        description: "Dry run (log only, create no branches/PRs)"
        type: boolean
        default: false
      log_level:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info
      base_branches:
        description: "Base branches to update, comma-separated (e.g. '**default**, release-1.36'). '**default**' = default branch. Empty = SCHEDULED_BASE_BRANCHES (in workflow file)."
        type: string
        default: "**default**"
      add_unique_branch_prefix:
        description: "Add a unique section to every Renovate branch name (renovate/<dep> -> renovate/<unique>/<dep>). Useful for testing, so each run creates new branches instead of skipping existing ones."
        type: boolean
        default: false
      pr_mode:
        description: "Pull requests grouping mode for Renovate. Separate PRs for each dependency (Renovate default), or one single PR for all."
        type: choice
        options: [separate, single]
        default: single
      auto_merge:
        description: "Enable auto-merge for Renovate PRs"
        type: boolean
        default: false
      pr_hourly_limit:
        description: "Maximum Renovate PRs per hour. Positive values only, no 0, Renovate default = 2. Increase if you need more for testing!"
        type: number
        default: 10
      recreate_when:
        description: "Re-raise update closed/merged PRs?. 'always' = propose again every run even after revert (repeat testing). 'auto' (Renovate default) = only when the update changed. 'never' = fully respect closed PRs."
        type: choice
        options: [auto, always, never]
        default: auto

env:
  # Base branches of scheduled runs (and of manual runs with empty base_branches), comma-separated.
  # '**default**' = the repo's default branch.
  SCHEDULED_BASE_BRANCHES: "**default**, release-1.37, release-1.36"

# Empty block required.
# When using GITHUB_TOKEN instead of App, scope permission here!
# Restrictions apply on possible permission here.
permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    environment: renovate-vidispine-content-wf
    outputs:
      app-slug: ${{ steps.app-token.outputs.app-slug }}
      base-branches: ${{ steps.options.outputs.base-branches }}
    steps:
      # IMPORTANT: Keep version comments after action digests here, required by Renovate!
      #
      # Using GitHub App instead of GITHUB_TOKEN, to get all necessary permissions.
      # The GitHub App must be installed in GitHub, and 
      # the secret AppID and private key must be in the environment.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least privilege: only permissions requested here, must be set for GitHub app.
          # HTTP 422 error, if the app doesn't hold the requested permission.
          permission-contents: write        # push renovate/* branches + commits
          permission-pull-requests: write   # open/update/close update PRs
          permission-issues: write          # maintain the Dependency Dashboard issue
          # NOTE: "Checks: write" in the GitHub app, and 'permission-checks: write' here, may 
          # be necessary if automerge is enabled in the future.
          permission-statuses: write        # write Renovate's own renovate/* commit statuses
          permission-workflows: write       # REQUIRED to commit changes to .github/workflows/*
                                            # (the github-actions manager bumps action versions).
                                            # This does NOT affect whether CI is triggered.
          permission-administration: read   # read branch protection / required checks
          permission-vulnerability-alerts: read  # "Dependabot alerts" - drives vulnerabilityAlerts
          permission-metadata: read         # implicit on every installation; listed for clarity
      # Run options that are not plain values. Scheduled runs have no inputs: they get single PR
      # and automerge. Written to GITHUB_ENV, so do NOT also set these keys in the env of
      # "Run Renovate" - step env would override them.
      - name: Compose run options
        id: options
        env:
          PR_MODE: ${{ inputs.pr_mode || 'single' }}
          AUTO_MERGE: ${{ github.event_name == 'schedule' || inputs.auto_merge }}
          BASE_INPUT: ${{ inputs.base_branches || env.SCHEDULED_BASE_BRANCHES }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Base branches Renovate updates and targets PRs against. The workflow_dispatch "Use
          # workflow from" selector only picks which YAML runs - it does NOT change this.
          # Comma-separated input -> JSON array, '**default**' resolved to the real name (needed
          # for the branch prefix below and the "approve" job).
          BASES=$(tr ',' '\n' <<< "$BASE_INPUT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' | while read -r b; do
                if [ "$b" = '**default**' ]; then echo "$DEFAULT_BRANCH"; else echo "$b"; fi
              done | jq -Rnc '[inputs] | unique')
          echo "RENOVATE_BASE_BRANCHES=$BASES" >> "$GITHUB_ENV"
          echo "base-branches=$BASES" >> "$GITHUB_OUTPUT"
          # Namespace every Renovate branch AND PR by its base branch, so a run for one base
          # branch never sees - or is blocked by - another branch's PRs (Renovate detects
          # "already handled" updates by head-branch name): renovate/master-<dep>, PR title
          # "... [master]". With several base branches Renovate does this itself (branch
          # prefix "<base>-", title " (<base>)"), so set it only for a single base branch.
          if [ "$(jq length <<< "$BASES")" -eq 1 ]; then
            BASE=$(jq -r '.[0]' <<< "$BASES")
            echo "RENOVATE_ADDITIONAL_BRANCH_PREFIX=$BASE-" >> "$GITHUB_ENV"
            echo "RENOVATE_COMMIT_MESSAGE_SUFFIX=[$BASE]" >> "$GITHUB_ENV"
          fi
          # Top-level keys only, never packageRules: "force" REPLACES the whole packageRules array
          # of renovate.json. No separateMajorMinor=false: it would merge major into the same
          # update as minor/patch, so a blocked major would also drop the minor/patch update.
          FORCE='{}'
          if [ "$PR_MODE" = "single" ]; then
            FORCE='{"groupName":"all dependencies"}'
          fi
          echo "RENOVATE_FORCE=$FORCE" >> "$GITHUB_ENV"
          # Renovate turns on GitHub's own auto-merge (platformAutomerge, default): GitHub merges
          # as soon as the required checks pass. The approval comes from the "approve" job.
          echo "RENOVATE_AUTOMERGE=$AUTO_MERGE" >> "$GITHUB_ENV"
      - name: Run Renovate
        id: renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          # RENOVATE_FORCE, _AUTOMERGE, _BASE_BRANCHES, _ADDITIONAL_BRANCH_PREFIX and
          # _COMMIT_MESSAGE_SUFFIX come from the "Compose run options" step.
          # Only look at this repository.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PR_HOURLY_LIMIT: ${{ inputs.pr_hourly_limit || 10 }}
          # Allowlist for postUpgradeTasks commands (self-hosted requirement). Only commands
          # matching one of these regexes may run. Keeps the checksum-refresh hook (see
          # renovate.json -> postUpgradeTasks) in sync with each version bump.
          RENOVATE_ALLOWED_COMMANDS: '["^bash \.github/renovate/update-checksum\.sh "]'
          # Manual-run options (empty/ignored on scheduled runs).
          RENOVATE_DRY_RUN: ${{ inputs.dry_run && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPORT_TYPE: 'file'
          RENOVATE_REPORT_PATH: '/tmp/renovate-report.json'
          # config breakage -> hard exit.
          RENOVATE_CONFIG_VALIDATION_ERROR: 'true'
          # Only set a branch prefix with timestamp 'renovate-yyyyymmddhhmmss' if the input is true. Otherwise, leave it blank to use Renovate's default 'renovate/<dep>'.
          RENOVATE_BRANCH_PREFIX: ${{ inputs.add_unique_branch_prefix && format('renovate/{0}/', github.run_id) || 'renovate/' }}
          # Defeat Renovate's memory of CLOSED/MERGED PRs. Renovate does NOT read git history -
          # it compares the current file contents on the base branch to the datasource - but it
          # WILL refuse to re-raise an update whose PR you previously closed. recreateWhen=auto
          # (the default) only recreates when the update content changed; 'always' re-proposes
          # every run, so a reverted version comes back and repeat testing works; 'never' fully
          # respects closed PRs. Scheduled runs get the default 'auto'.
          RENOVATE_RECREATE_WHEN: ${{ inputs.recreate_when || 'auto' }}
          # Commit via the GitHub API: commits are GitHub-signed ("Verified") and authored by the
          # app's bot account. The "approve" job relies on that to accept only Renovate's commits.
          RENOVATE_PLATFORM_COMMIT: enabled
          # Credentials for cr.vidinet.net. A single host rule (no hostType) covers
          # both Docker images and Helm charts pulled from this registry.
          RENOVATE_HOST_RULES: >-
            [{"matchHost":"cr.vidinet.net","username":"${{ secrets.VIDINET_REGISTRY_USERNAME }}","password":"${{ secrets.VIDINET_REGISTRY_PASSWORD }}"}]

      # Keep the JSON report as a downloadable run artifact (like an Azure DevOps pipeline
      # artifact) so it can be inspected after the run. Uploaded before the check step and
      # with if: always() so it survives even when the check below fails or Renovate errored.
      # if-no-files-found: ignore -> no failure when Renovate crashed before writing a report.
      - name: Upload Renovate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-report
          path: /tmp/renovate-report.json
          if-no-files-found: ignore
          retention-days: 30

      # Renovate almost always exits 0, even when parts of a run silently fail (a failed
      # postUpgradeTask/artifact update, a branch it couldn't push). This step reads the
      # structured JSON report (RENOVATE_REPORT_TYPE=file above) and turns real problems
      # into a red job. GitHub has no "warning"/partially-succeeded status like Azure DevOps:
      # a run is only green or red, so soft issues are emitted as yellow ::warning::
      # annotations (run stays green) and only the three hard signals below fail the job.
      - name: Check Renovate report
        if: always()
        env:
          REPORT: /tmp/renovate-report.json
          # Branch results that mean Renovate could not do its job. 'error' is the real
          # failure result; add '*-limit-reached' here only if you want throttling to be red.
          FAILURE_RESULTS: '["error"]'
        run: |
          set -uo pipefail                # not -e: collect all issues first, then decide
          repo="$GITHUB_REPOSITORY"
          issues=0

          # 1) Renovate process itself failed. The action step already goes red on a
          #    non-zero exit; surface it explicitly so this step is one source of truth.
          if [ "${{ steps.renovate.outcome }}" = "failure" ]; then
            echo "::error::Renovate exited non-zero for ${repo}."
            issues=$((issues+1))
          fi

          if [ ! -f "$REPORT" ]; then
            echo "::error::No report at ${REPORT} - Renovate crashed before reporting."
            exit 1
          fi

          # 2) PR-creation / branch failures: branches whose result is in FAILURE_RESULTS.
          failed=$(jq -r --arg repo "$repo" --argjson fails "$FAILURE_RESULTS" '
            (.repositories[$repo].branches // [])
            | map(select(.result as $r | $fails | index($r)))
            | .[] | "\(.branchName // .prTitle // "?") -> \(.result)"
          ' "$REPORT")
          if [ -n "$failed" ]; then
            echo "::error::Renovate could not create/update branch(es) for ${repo}:"
            echo "$failed" | while IFS= read -r line; do echo "::error::  $line"; done
            issues=$((issues+1))
          fi

          # 3) Artifact / postUpgradeTask failures (e.g. update-checksum.sh), read
          #    structurally from the report instead of log-scraping - no regex false positives.
          artifacts=$(jq --arg repo "$repo" '
            [ (.repositories[$repo] // {}) | .. | objects
              | select(has("artifactErrors")) | .artifactErrors[] ] | length
          ' "$REPORT")
          if [ "$artifacts" -gt 0 ]; then
            echo "::error::${artifacts} artifact/postUpgradeTask error(s) for ${repo} (e.g. update-checksum.sh)."
            issues=$((issues+1))
          fi

          # 4) Everything else worth seeing but not failing -> yellow annotations (stays green).
          jq -r --arg repo "$repo" '
            def lvl: if type=="number" then . else ({"warn":40,"error":50,"fatal":60}[.] // 0) end;
            [ (.problems // [])[], ((.repositories[$repo] // {}).problems // [])[] ]
            | .[] | select((.level|lvl) == 40) | "::warning::" + (.msg // "warning")
          ' "$REPORT" | tee -a "$GITHUB_STEP_SUMMARY"

          [ "$issues" -eq 0 ] || exit 1

  # Approves the open Renovate PRs, so GitHub's auto-merge merges them once the required checks
  # (Gated test) pass. GitHub's auto-merge ignores ruleset bypass, hence a real approval. The
  # approver is github-actions[bot] (GITHUB_TOKEN): the PR author cannot approve its own PR.
  # Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull
  # requests". Approved only if the PR:
  #  * touches nothing but the files Renovate normally updates, and
  #  * contains only commits of the Renovate app: author is the app's bot account and the
  #    commit is GitHub-signed (RENOVATE_PLATFORM_COMMIT). A pushed commit with a faked author
  #    email is not signed by GitHub, a commit via the web UI has another author.
  # The approval is bound to the checked head commit (commit_id). With "Dismiss stale approvals
  # on push" in the ruleset, any later push removes it -> the PR needs a manual review.
  approve:
    needs: renovate
    if: ${{ (github.event_name == 'schedule' || inputs.auto_merge) && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AUTHOR: app/${{ needs.renovate.outputs.app-slug }}
      BOT: ${{ needs.renovate.outputs.app-slug }}[bot]
      BASES: ${{ needs.renovate.outputs.base-branches }}
      ALLOWED: '^(images/hull-integration/Dockerfile|hull-vidispine-addon/hull-vidispine-addon\.yaml|\.github/workflows/renovate\.yml)$'
    steps:
      - name: Approve Renovate PRs
        run: |
          set -euo pipefail
          jq -r '.[]' <<< "$BASES" | while read -r base; do
            gh pr list --author "$AUTHOR" --base "$base" --state open \
              --json number,headRefOid,reviewDecision,files \
              --jq '.[] | select(.reviewDecision != "APPROVED") | "\(.number) \(.headRefOid) \([.files[].path] | join(" "))"' |
            while read -r pr head files; do

              # Check if files are allowed for automerged changes:
              outside=$(tr ' ' '\n' <<< "$files" | grep -Ev "$ALLOWED" || true)
              if [ -n "$outside" ]; then
                echo "::warning::PR #$pr ($base) not approved, it changes other files: $outside"
                continue
              fi

              # Check if all commits are by the bot AND committed + signed by GitHub itself. "verified"
              # alone also accepts a user's own GPG/SSH key: it matches the COMMITTER, while the
              # author email can be faked to the bot's. Commits via the GitHub API (platform commit)
              # have committer "web-flow" (GitHub). A user's web UI commit has committer web-flow too,
              # but the user as author, not the bot.
              commits=$(gh api "repos/$GH_REPO/pulls/$pr/commits" --paginate --jq '.[]' | jq -s .)
              foreign=$(jq -r --arg bot "$BOT" '.[]
                | select(.author.login != $bot
                    or .committer.login != "web-flow"
                    or .commit.verification.verified != true) | .sha' <<< "$commits")
              last=$(jq -r '.[-1].sha' <<< "$commits")
              if [ -n "$foreign" ]; then
                echo "::warning::PR #$pr ($base) not approved, commits not from $BOT or not signed: $foreign"
                continue
              fi

              # Check if last commit is still the head of the PR branch:
              if [ "$last" != "$head" ]; then
                echo "::warning::PR #$pr ($base) not approved, branch changed during the check."
                continue
              fi

              # Approve the PR via the GitHub API: only if all previous checks passed (loop iteration not interrupted by "continue").
              gh api "repos/$GH_REPO/pulls/$pr/reviews" -f event=APPROVE -f commit_id="$head" \
                -f body="Automatic approval of a Renovate version update (commit $head)." > /dev/null
              echo "PR #$pr ($base) approved at $head."
            done
          done
