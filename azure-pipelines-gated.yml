# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
parameters:
- name: RunTests
  type: boolean
  default: true

trigger: none
pr:
  branches:
    include:
    - master
    - main
    - release-*

pool:
    vmImage: 'ubuntu-24.04'
jobs:
- job: RunTests
  steps:

  - template: azure-pipelines-test.yml  # Template reference
    parameters:
      HelmVersions:
      - version: "3.19.0"
      - version: "3.19.1"
      - version: "3.19.2"
      - version: "3.21.3"
      - version: "4.0.0"
      - version: "4.0.1"
      - version: "4.2.3"

  # Build the image without pushing, so Dockerfile changes (e.g. Renovate updates, which are
  # auto-merged) are validated before the merge. The real build + push is in azure-pipelines.yml.
  - script: |
      set -euo pipefail
      docker buildx build --file ./images/hull-integration/Dockerfile ./images/hull-integration
    displayName: Build hull-integration image (no push)
      



