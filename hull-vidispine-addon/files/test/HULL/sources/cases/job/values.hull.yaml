###################################################
### CONFIG
hull:
  config:
    specific:
      components:
        envtest: {}
  objects:
    job:
      disabled:
        pod:
          containers: 
            main:
              image:
                registry: ""
                repository: my/image/repo
        
      static_name:
        pod:
          containers: 
            main:
              image:
                registry: ""
                repository: my/image/repo
        
      metadata_merge:
        pod:
          containers: 
            main:
              image:
                registry: ""
                repository: my/image/repo
        
      metadata_overwrite:
        pod:
          containers: 
            main:
              image:
                registry: ""
                repository: my/image/repo
        
      image_name_empty_registry:
        pod:
          containers: 
            main:
              image:
                registry: ""
                repository: my/image/repo

      image_name_registry:
        pod:
          containers:
            main:
              image:
                registry: local.registry
                repository: my/image/repo

      image_name_tag:
        pod:
          containers:
            main:
              image:
                repository: my/image/repo
                tag: "99.9"

      removal_test:
        pod:
          containers:
            remove: null
            keep:
              image:
                repository: my/image/repo
                tag: "99.9"
              ports:
                remove: null
                
      volume_test:
        pod:
          containers:
            main:
              image:
                repository: my/image/repo
                tag: "99.9"
          volumes:
            to_be_removed: null

      env_refs:
        pod:
          containers:
            main:
              image:
                repository: my/image/repo
                tag: "99.9"
              env: _HT/hull.vidispine.addon.library.component.pod.env:COMPONENT:"envtest":FROM_SECRETS:"ENV_1_SECRET=a-secret=a-key,ENV_2_STATIC_SECRET=b-secret=b-key=true":FROM_CONFIGMAPS:"ENV_3_CONFIGMAP=a-configmap=a-key,ENV_4_STATIC_CONFIGMAP=b-configmap=b-key=true"

  ###################################################