################################ 
### Without a memory limit a default heap is needed
################################
hull: 
  objects:
    deployment:
      main:
        pod:
          containers:
            main:
              image:
                registry: ""
                repository: my/image/repo
              env:
                JAVA_OPTS:
                  value: _HT!{{ include "hull.vidispine.addon.library.java.heap" (dict "PARENT_CONTEXT" (index . "$") "OBJECT_TYPE" (index . "OBJECT_TYPE") "OBJECT_INSTANCE_KEY" (index . "OBJECT_INSTANCE_KEY") "CONTAINER" "main" "SETTINGS" (dict "nativeReserve" "1Gi")) }}

